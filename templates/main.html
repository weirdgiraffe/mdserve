<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>

    <!-- Critical: Apply theme before first paint to prevent flash -->
    <script>
        // The mode is light, dark, or auto. Auto follows the system.
        function applyThemeMode(mode) {
            const dark = mode === 'dark' ||
                (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-mode', mode);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        }
        applyThemeMode(localStorage.getItem('theme-mode') || 'auto');
        document.documentElement.classList.add('theme-initialized');
    </script>

    <style>
        /* Prevent flash by hiding content until theme is applied */
        html:not(.theme-initialized) body {
            opacity: 0;
        }

        html.theme-initialized body {
            opacity: 1;
            transition: opacity 0.1s ease-in;
        }

        /* Universal box-sizing */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* Everforest (medium), https://github.com/sainnhe/everforest */
        :root {
            --bg-color: #fdf6e3;
            --text-color: #5c6a72;
            --border-color: #e0dcc7;
            --border-color-light: #e6e2cc;
            --code-bg: #f4f0d9;
            --blockquote-color: #829181;
            --link-color: #3a94c5;
            --table-header-bg: #efebd4;
            --red: #f85552;
            --orange: #f57d26;
            --yellow: #dfa000;
            --green: #8da101;
            --aqua: #35a77c;
            --blue: #3a94c5;
            --purple: #df69ba;
            --grey: #939f91;
            --content-max-width: 900px;
            --transition-speed: 0.3s;
            --transition-timing: ease;
        }

        [data-theme="dark"] {
            --bg-color: #2d353b;
            --text-color: #d3c6aa;
            --border-color: #4f585e;
            --border-color-light: #475258;
            --code-bg: #343f44;
            --blockquote-color: #9da9a0;
            --link-color: #7fbbb3;
            --table-header-bg: #3d484d;
            --red: #e67e80;
            --orange: #e69875;
            --yellow: #dbbc7f;
            --green: #a7c080;
            --aqua: #83c092;
            --blue: #7fbbb3;
            --purple: #d699b6;
            --grey: #859289;
        }

        /* Common body styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            transition: background-color var(--transition-speed) var(--transition-timing),
                        color var(--transition-speed) var(--transition-timing);
        }

        /* Centered content layout */
        body {
            max-width: var(--content-max-width);
            margin: 0 auto;
            padding: 20px;
        }

        /* Directory listing */
        .listing {
            list-style: none;
            padding: 0;
            margin: 0;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        .listing li {
            margin: 2px 0;
        }

        .listing a {
            color: var(--link-color);
            text-decoration: none;
        }

        .listing a:hover {
            text-decoration: underline;
        }

        .theme-picker {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .theme-toggle,
        .theme-menu button {
            background: var(--code-bg);
            border: 1px solid var(--border-color-light);
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-color);
            transition: background 0.2s var(--transition-timing),
                        border-color var(--transition-speed) var(--transition-timing);
        }

        .theme-toggle:hover,
        .theme-toggle:focus-visible,
        .theme-menu button:hover,
        .theme-menu button:focus-visible {
            background: var(--border-color-light);
            outline: none;
        }

        .theme-menu {
            position: absolute;
            right: 0;
            margin: 4px 0 0;
            padding: 0;
            list-style: none;
        }

        .theme-menu button {
            width: 100%;
            text-align: left;
            white-space: nowrap;
            border-radius: 0;
        }

        .theme-menu li + li button {
            border-top: none;
        }

        .theme-menu button.selected {
            font-weight: 600;
        }

        .theme-menu button.selected::after {
            content: " ✓";
        }

        pre {
            background-color: var(--code-bg);
            border-radius: 6px;
            padding: 16px;
            overflow: auto;
        }
        code {
            background-color: var(--code-bg);
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }
        pre code {
            background-color: transparent;
            padding: 0;
        }

        /* highlight.js tokens, mapped as the Everforest vim syntax groups */
        .hljs-keyword, .hljs-selector-tag, .hljs-doctag, .hljs-deletion { color: var(--red); }
        .hljs-operator, .hljs-tag, .hljs-name, .hljs-selector-class,
        .hljs-selector-id, .hljs-selector-pseudo, .hljs-section { color: var(--orange); }
        .hljs-type, .hljs-built_in, .hljs-title.class_ { color: var(--yellow); }
        .hljs-string, .hljs-regexp, .hljs-title, .hljs-addition { color: var(--green); }
        .hljs-symbol, .hljs-variable.constant_, .hljs-template-variable { color: var(--aqua); }
        .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-property { color: var(--blue); }
        .hljs-number, .hljs-literal, .hljs-meta, .hljs-meta .hljs-keyword { color: var(--purple); }
        .hljs-comment, .hljs-quote { color: var(--grey); font-style: italic; }
        .hljs-section, .hljs-strong { font-weight: bold; }
        .hljs-emphasis { font-style: italic; }
        blockquote {
            border-left: 4px solid var(--border-color-light);
            padding-left: 16px;
            margin-left: 0;
            color: var(--blockquote-color);
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
        }
        th, td {
            border: 1px solid var(--border-color-light);
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: var(--table-header-bg);
            font-weight: bold;
        }
        h1, h2, h3, h4, h5, h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
            position: relative;
        }
        .anchor {
            position: absolute;
            left: -1em;
            width: 1em;
            opacity: 0;
            color: var(--blockquote-color);
        }
        :is(h1, h2, h3, h4, h5, h6):hover .anchor { opacity: 1; text-decoration: none; }
        h1 { border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        h2 { border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        a { color: var(--link-color); text-decoration: none; }
        a:hover { text-decoration: underline; }
        img { max-width: 100%; height: auto; }
    </style>

    {% if mermaid_enabled %}
    <script src="/__mdserve/mermaid.min.js"></script>
    {% endif %}
    {% if highlight_enabled %}
    <script src="/__mdserve/highlight.min.js"></script>
    {% endif %}
    <script>
        // Theme management. applyThemeMode() in the early script sets
        // data-mode and data-theme; this code keeps the page in sync.
        const THEME_ICONS = { light: '☀️', dark: '🌙', auto: '🌓' };

        function updateThemeButton() {
            const mode = document.documentElement.getAttribute('data-mode');
            const button = document.getElementById('themeToggle');
            button.textContent = THEME_ICONS[mode];
            button.title = 'Theme: ' + mode;
            document.querySelectorAll('.theme-menu button').forEach((item) => {
                item.classList.toggle('selected', item.dataset.mode === mode);
            });
        }

        function onThemeChange() {
            updateThemeButton();
            updateMermaidTheme();
        }

        function toggleThemeMenu() {
            document.getElementById('themeMenu').toggleAttribute('hidden');
        }

        function closeThemeMenu() {
            document.getElementById('themeMenu').setAttribute('hidden', '');
        }

        function selectThemeMode(mode) {
            localStorage.setItem('theme-mode', mode);
            applyThemeMode(mode);
            onThemeChange();
            closeThemeMenu();
        }

        function isDarkTheme() {
            return document.documentElement.getAttribute('data-theme') === 'dark';
        }

        function getMermaidTheme() {
            return isDarkTheme() ? 'dark' : 'default';
        }

        function initMermaid() {
            if (typeof mermaid !== 'undefined') {
                mermaid.initialize({
                    startOnLoad: false,
                    theme: getMermaidTheme(),
                    themeVariables: {
                        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif'
                    },
                    flowchart: {
                        useMaxWidth: true,
                        htmlLabels: true
                    },
                    sequence: {
                        useMaxWidth: true
                    },
                    gantt: {
                        useMaxWidth: true
                    }
                });

                // Find and transform mermaid code blocks
                transformMermaidCodeBlocks();

                // Render all mermaid diagrams
                mermaid.run();
            }
        }

        function transformMermaidCodeBlocks() {
            // Find all code blocks with language-mermaid class
            const mermaidCodeBlocks = document.querySelectorAll('code.language-mermaid');

            mermaidCodeBlocks.forEach((codeElement, index) => {
                const preElement = codeElement.parentElement;
                if (preElement && preElement.tagName === 'PRE') {
                    // Get the mermaid code content
                    const mermaidCode = codeElement.textContent;

                    // Create new mermaid div
                    const mermaidDiv = document.createElement('div');
                    mermaidDiv.className = 'mermaid';
                    mermaidDiv.id = `mermaid-${index}`;
                    mermaidDiv.textContent = mermaidCode;
                    mermaidDiv.setAttribute('data-original', mermaidCode);

                    // Replace the pre/code block with the mermaid div
                    preElement.parentElement.replaceChild(mermaidDiv, preElement);
                }
            });
        }

        function updateMermaidTheme() {
            if (typeof mermaid !== 'undefined') {
                mermaid.initialize({
                    startOnLoad: false,
                    theme: getMermaidTheme(),
                    themeVariables: {
                        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif'
                    }
                });

                // Re-render all mermaid diagrams with new theme
                const mermaidElements = document.querySelectorAll('.mermaid');
                mermaidElements.forEach((element) => {
                    element.removeAttribute('data-processed');
                    const originalContent = element.getAttribute('data-original');
                    if (originalContent) {
                        element.textContent = originalContent;
                    }
                });

                mermaid.run();
            }
        }

        function initHighlight() {
            if (typeof hljs !== 'undefined') {
                // Mermaid blocks are diagrams, not code, and initMermaid()
                // already replaced them. Painting one would race that replace.
                const codeBlocks = document.querySelectorAll('pre code[class*="language-"]');
                codeBlocks.forEach((codeElement) => {
                    if (!codeElement.classList.contains('language-mermaid')) {
                        hljs.highlightElement(codeElement);
                    }
                });
            }
        }

        // Live reload via Server-Sent Events. EventSource reconnects natively,
        // so no hand-rolled reconnect loop is needed. Only present when the
        // page is a rendered markdown file (listings get no reload channel).
        {% if reload_file %}
        function setupLiveReload() {
            const url = '/__mdserve/events?file=' + encodeURIComponent({{ reload_file | tojson }});
            const source = new EventSource(url);
            source.addEventListener('reload', function() {
                window.location.reload();
            });
        }
        {% else %}
        function setupLiveReload() {}
        {% endif %}

        // Initialize theme and live reload on page load
        document.addEventListener('DOMContentLoaded', function() {
            updateThemeButton();
            initMermaid();
            initHighlight();
            setupLiveReload();

            // In auto mode, follow a change of the system preference.
            matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
                if (document.documentElement.getAttribute('data-mode') === 'auto') {
                    applyThemeMode('auto');
                    onThemeChange();
                }
            });

            // Close the menu on a click outside the picker, or on ESC.
            const picker = document.querySelector('.theme-picker');
            document.addEventListener('click', function(e) {
                if (!picker.contains(e.target)) {
                    closeThemeMenu();
                }
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeThemeMenu();
                }
            });
        });
    </script>
</head>
<body>
<div class="theme-picker">
    <button class="theme-toggle" id="themeToggle" onclick="toggleThemeMenu()"></button>
    <ul class="theme-menu" id="themeMenu" hidden>
        <li><button data-mode="light" onclick="selectThemeMode('light')">☀️ Light</button></li>
        <li><button data-mode="dark" onclick="selectThemeMode('dark')">🌙 Dark</button></li>
        <li><button data-mode="auto" onclick="selectThemeMode('auto')">🌓 Auto</button></li>
    </ul>
</div>
<div id="content">
{{ content }}
</div>

</body>
</html>
